name: Apply English Documentation Update

on:
  push:
    paths:
      - METEOR_CAFE_ENGLISH_DOCUMENTATION_UPDATE.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract documentation package
        shell: bash
        run: |
          set -euo pipefail
          archive="METEOR_CAFE_ENGLISH_DOCUMENTATION_UPDATE.zip"
          test -f "$archive"
          mkdir -p "$RUNNER_TEMP/meteor-cafe-docs"
          unzip -q "$archive" -d "$RUNNER_TEMP/meteor-cafe-docs"

      - name: Apply documentation files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='APPLY_UPDATE.md' "$RUNNER_TEMP/meteor-cafe-docs/" ./
          rm -f METEOR_CAFE_ENGLISH_DOCUMENTATION_UPDATE.zip

      - name: Commit documentation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to apply."
            exit 0
          fi
          git commit -m "Update Meteor Cafe documentation in English"
          git push
