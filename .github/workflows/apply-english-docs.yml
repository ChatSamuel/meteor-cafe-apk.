name: Refresh Meteor Cafe README and download instructions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-english-docs.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update README and installation guide
        shell: bash
        env:
          README_B64: 
          INSTALLATION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path

          files = {
              "README.md": os.environ["README_B64"],
              "docs/INSTALLATION.md": os.environ["INSTALLATION_B64"],
          }
          for name, encoded in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
              print(f"Updated {name}")
          PYTHON

      - name: Commit documentation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/INSTALLATION.md
          if git diff --cached --quiet; then
            echo "Documentation is already up to date."
            exit 0
          fi
          git commit -m "Improve Meteor Cafe README and fix APK download link"
          git push
