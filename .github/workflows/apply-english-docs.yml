        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import io
          import os
          import pathlib
          import shutil
          import zipfile

          root = pathlib.Path.cwd().resolve()
          data = base64.b64decode(os.environ["DOCS_ARCHIVE_B64"], validate=False)
          buffer = io.BytesIO(data)

          with zipfile.ZipFile(buffer) as archive:
              entries = [item for item in archive.infolist() if not item.is_dir()]
              if not entries:
                  raise SystemExit("The bundled documentation archive is empty.")

              staged = []
              for item in entries:
                  relative = pathlib.PurePosixPath(item.filename)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"Unsafe path in bundled archive: {item.filename}")
                  if relative.as_posix() == "APPLY_UPDATE.md":
                      continue
                  target = (root / pathlib.Path(*relative.parts)).resolve()
                  if root not in target.parents:
                      raise SystemExit(f"Unsafe destination path: {item.filename}")
                  staged.append((item, target))

              for item, target in staged:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(item) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)

          # Remove the previous Portuguese filenames after their English replacements are in place.
          obsolete = [
              'LEIA-ME_UPLOAD_GITHUB.md',
              'android/METEOR_CAFE_APK_DEDICADO/INICIO_RAPIDO.md',
              'android/METEOR_CAFE_APK_DEDICADO/METEOR_CAFE_ADAPTACAO_GALAXY_A05.md',
              'android/METEOR_CAFE_APK_DEDICADO/METEOR_CAFE_AUDITORIA_INICIAL.md',
              'android/METEOR_CAFE_APK_DEDICADO/METEOR_CAFE_AUDITORIA_TECNICA_02.md',
              'android/METEOR_CAFE_APK_DEDICADO/STATUS_DESENVOLVIMENTO.md',
          ]
          for relative in obsolete:
              path = root / relative
              if path.is_file():
                  path.unlink()

          print(f"Applied {len(staged)} documentation files.")
          print("Original game files, Android source, artwork, screenshots and build workflow were not replaced.")
          PY

      - name: Commit documentation changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The documentation is already up to date."
            exit 0
          fi
          git commit -m "Update Meteor Cafe documentation in English"
          git push
