name: Compilar Meteor Cafe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Meteor Cafe
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7.0.1

      - name: Extrair projeto dedicado
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/METEOR_CAFE_APK_DEDICADO_FONTE.zip"
          test -f "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/work"

          PROJECT_DIR="$GITHUB_WORKSPACE/work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader"

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto extraido e conferido: $PROJECT_DIR"

      - name: Preparar Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          # Cache do Gradle desativado intencionalmente.
          # O projeto estava dentro do ZIP e nao existia na raiz no momento
          # em que setup-java tentava localizar os arquivos para o cache.

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Instalar Android 17 Preview, Build Tools e NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME e ANDROID_SDK_ROOT nao foram definidos."
            exit 1
          fi

          echo "Consultando pacotes Android incluindo o canal preview..."
          sdkmanager --list --channel=3 > "$RUNNER_TEMP/android-sdk-packages.txt"

          if ! grep -Eq 'platforms;android-37([[:space:]]|$)' "$RUNNER_TEMP/android-sdk-packages.txt"; then
            echo "A plataforma platforms;android-37 nao apareceu no catalogo do canal preview."
            grep -i 'android-37\|Cinnamon Bun' "$RUNNER_TEMP/android-sdk-packages.txt" || true
            exit 1
          fi

          BUILD_TOOLS_PACKAGE="$(grep -oE 'build-tools;37\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/android-sdk-packages.txt" | sort -Vu | tail -n 1)"
          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "Nenhuma versao Build Tools 37.x foi encontrada no catalogo."
            grep -i 'build-tools;37' "$RUNNER_TEMP/android-sdk-packages.txt" || true
            exit 1
          fi

          echo "Plataforma: platforms;android-37"
          echo "Build Tools: $BUILD_TOOLS_PACKAGE"
          echo "NDK: 29.0.14206865"

          sdkmanager --channel=3 \
            "platforms;android-37" \
            "$BUILD_TOOLS_PACKAGE" \
            "ndk;29.0.14206865"

          test -d "$SDK_ROOT/platforms/android-37"
          test -d "$SDK_ROOT/build-tools/${BUILD_TOOLS_PACKAGE#build-tools;}"
          test -d "$SDK_ROOT/ndk/29.0.14206865"
          echo "Android SDK, Build Tools e NDK instalados e conferidos."

      - name: Conferir JAR original incorporado
        shell: bash
        run: |
          set -euo pipefail
          JAR="$PROJECT_DIR/app/src/main/assets/games/meteor_cafe.jar"
          test -f "$JAR"
          echo "a621bf0e11046aabb4ddcaa9c0c3d3a3aefa9340a415c2ce690ef977a394f8c6  $JAR" | sha256sum --check

      - name: Restaurar biblioteca de audio MIDI
        shell: bash
        run: |
          set -euo pipefail
          SUBMODULE="$PROJECT_DIR/app/src/main/cpp/mmapi_tsf/TinySoundFont"
          rm -rf "$SUBMODULE"
          mkdir -p "$(dirname "$SUBMODULE")"
          git clone --depth 1 https://github.com/schellingb/TinySoundFont.git "$SUBMODULE"
          test -f "$SUBMODULE/tsf.h"
          echo "TinySoundFont restaurado."

      - name: Compilar variante Meteor Debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleMeteorDebug

      - name: Conferir APK gerado
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/meteor/debug"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v6
        with:
          name: Meteor-Cafe-APK-debug
          path: work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader/app/build/outputs/apk/meteor/debug/*.apk
          if-no-files-found: error
          retention-days: 7
