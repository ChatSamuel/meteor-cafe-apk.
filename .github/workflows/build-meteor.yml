name: Compilar Meteor Cafe — V10 (assinatura estável de teste)

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Meteor Cafe V10
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7.0.1

      - name: Extrair projeto V10
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/METEOR_CAFE_APK_DEDICADO_FONTE_GALAXY_A05_V10.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Arquivo V10 nao encontrado na raiz: $ZIP_FILE"
            echo "ZIPs disponiveis na raiz:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' || true
            exit 1
          fi
          unzip -tq "$ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/work"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/work"
          PROJECT_DIR="$GITHUB_WORKSPACE/work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto V10 extraido: $PROJECT_DIR"

      - name: Preparar Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Encontrar e instalar Android API 37, Build Tools e NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          PACKAGE_LIST="$RUNNER_TEMP/android-sdk-packages.txt"
          sdkmanager --list --channel=3 > "$PACKAGE_LIST"
          PLATFORM_PACKAGE="$(awk -F'|' '{p=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", p); if (p ~ /^platforms;android-37\.[0-9]+$/) print p}' "$PACKAGE_LIST" | sort -V | tail -n 1)"
          BUILD_TOOLS_PACKAGE="$(awk -F'|' '{p=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", p); if (p ~ /^build-tools;[0-9]+\.[0-9]+\.[0-9]+$/) print p}' "$PACKAGE_LIST" | sort -V | tail -n 1)"
          NDK_PACKAGE='ndk;29.0.14206865'
          test -n "$PLATFORM_PACKAGE"
          test -n "$BUILD_TOOLS_PACKAGE"
          grep -Fq "$NDK_PACKAGE" "$PACKAGE_LIST"
          echo "Instalando $PLATFORM_PACKAGE, $BUILD_TOOLS_PACKAGE, $NDK_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE" "$NDK_PACKAGE"
          PLATFORM_DIR="${PLATFORM_PACKAGE#platforms;}"
          BUILD_TOOLS_DIR="${BUILD_TOOLS_PACKAGE#build-tools;}"
          test -f "$SDK_ROOT/platforms/$PLATFORM_DIR/android.jar"
          test -d "$SDK_ROOT/build-tools/$BUILD_TOOLS_DIR"
          test -f "$SDK_ROOT/ndk/29.0.14206865/source.properties"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verificar JAR do Meteor Cafe
        shell: bash
        run: |
          set -euo pipefail
          JAR="$PROJECT_DIR/app/src/main/assets/games/meteor_cafe.jar"
          ORIGINAL_JAR="$GITHUB_WORKSPACE/work/METEOR_CAFE_APK_DEDICADO/original/meteor_cafe_original.jar"
          test -f "$JAR"
          test -f "$ORIGINAL_JAR"
          echo "99d91a52fc3b4fc0340b6761639aacd98de6b3c5e5bfdce0dab991047c00910a  $JAR" | sha256sum --check
          echo "a621bf0e11046aabb4ddcaa9c0c3d3a3aefa9340a415c2ce690ef977a394f8c6  $ORIGINAL_JAR" | sha256sum --check

      - name: Restaurar biblioteca de audio MIDI
        shell: bash
        run: |
          set -euo pipefail
          SUBMODULE="$PROJECT_DIR/app/src/main/cpp/mmapi_tsf/TinySoundFont"
          rm -rf "$SUBMODULE"
          mkdir -p "$(dirname "$SUBMODULE")"
          git clone --depth 1 https://github.com/schellingb/TinySoundFont.git "$SUBMODULE"
          test -f "$SUBMODULE/tsf.h"

      - name: Restaurar chave de assinatura de teste persistente
        id: debug-key-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-meteor-cafe-debug-keystore-v10-v1

      - name: Criar ou verificar chave de assinatura de teste
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Criando chave de teste persistente para a primeira compilacao V10."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Chave de teste restaurada do cache do repositorio."
          fi
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | grep -E 'SHA256:|SHA256 fingerprint'

      - name: Salvar chave de assinatura para as proximas compilacoes
        if: steps.debug-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-meteor-cafe-debug-keystore-v10-v1

      - name: Conferir versoes do Gradle e Java
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          java -version
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compilar variante Meteor Debug Teste
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleMeteorDebug

      - name: Conferir APK e certificado
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/meteor/debug"
          APK_FILE="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_FILE"
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -name '37.*' | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK_FILE"
          echo "APK V10: $APK_FILE"
          sha256sum "$APK_FILE"
          ls -lh "$APK_FILE"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v6
        with:
          name: Meteor-Cafe-APK-V10-teste
          path: work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader/app/build/outputs/apk/meteor/debug/*.apk
          if-no-files-found: error
          retention-days: 7
