
name: Compilar Meteor Cafe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Instalar ferramentas Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"

      - name: Extrair projeto
        run: |
          unzip -q METEOR_CAFE_APK_DEDICADO_FONTE.zip -d work
          PROJECT_DIR="$GITHUB_WORKSPACE/work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader"
          test -f "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Recuperar biblioteca de audio
        run: |
          SUBMODULE="$PROJECT_DIR/app/src/main/cpp/mmapi_tsf/TinySoundFont"
          rm -rf "$SUBMODULE"
          mkdir -p "$(dirname "$SUBMODULE")"
          git clone --depth 1 https://github.com/schellingb/TinySoundFont.git "$SUBMODULE"
          test -f "$SUBMODULE/tsf.h"

      - name: Compilar Meteor Cafe
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleMeteorDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meteor-Cafe-APK
          path: work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader/app/build/outputs/apk/meteor/debug/*.apk
          if-no-files-found: error
          retention-days: 7
