name: Compilar Meteor Cafe — V9

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Meteor Cafe
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7.0.1

      - name: Localizar e extrair projeto dedicado (ZIP individual ou kit)
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$GITHUB_WORKSPACE/work"
          BUNDLE_DIR="$RUNNER_TEMP/meteor-cafe-v9-kit"
          SOURCE_ZIP_NAME="METEOR_CAFE_APK_DEDICADO_FONTE_GALAXY_A05_V8_UPLOAD.zip"
          SOURCE_ZIP="$GITHUB_WORKSPACE/$SOURCE_ZIP_NAME"
          KIT_ZIP="$GITHUB_WORKSPACE/METEOR_CAFE_V8_KIT.zip"

          mkdir -p "$WORK_DIR"

          if [ -f "$SOURCE_ZIP" ]; then
            echo "Arquivo-fonte individual encontrado na raiz."
            PROJECT_ARCHIVE="$SOURCE_ZIP"
          elif [ -f "$KIT_ZIP" ]; then
            echo "Kit V8 encontrado na raiz. Extraindo o pacote externo..."
            rm -rf "$BUNDLE_DIR"
            mkdir -p "$BUNDLE_DIR"
            unzip -tq "$KIT_ZIP"
            unzip -q "$KIT_ZIP" -d "$BUNDLE_DIR"

            PROJECT_ARCHIVE="$(find "$BUNDLE_DIR" -type f -name "$SOURCE_ZIP_NAME" -print -quit)"
            if [ -z "$PROJECT_ARCHIVE" ]; then
              echo "::error::O kit foi encontrado, mas nao contem $SOURCE_ZIP_NAME."
              echo "Arquivos encontrados dentro do kit:"
              find "$BUNDLE_DIR" -maxdepth 3 -type f -print || true
              exit 1
            fi
            echo "Arquivo-fonte interno localizado: $PROJECT_ARCHIVE"
          else
            echo "::error::Nao encontrei o ZIP V8 individual nem METEOR_CAFE_V8_KIT.zip na raiz."
            echo "Arquivos ZIP presentes na raiz:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%f\\n' || true
            exit 1
          fi

          unzip -tq "$PROJECT_ARCHIVE"
          unzip -q "$PROJECT_ARCHIVE" -d "$WORK_DIR"

          PROJECT_DIR="$WORK_DIR/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto extraido e conferido: $PROJECT_DIR"

      - name: Preparar Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Encontrar e instalar Android API 37, Build Tools e NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT nao foi definido."
            exit 1
          fi

          PACKAGE_LIST="$RUNNER_TEMP/android-sdk-packages.txt"
          echo "Consultando pacotes do SDK, incluindo o canal preview..."
          sdkmanager --list --channel=3 > "$PACKAGE_LIST"

          PLATFORM_PACKAGE="$(awk -F'|' '
            {
              package=$1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", package)
              if (package ~ /^platforms;android-37\.[0-9]+$/) print package
            }
          ' "$PACKAGE_LIST" | sort -V | tail -n 1)"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "::error::Nenhum pacote platforms;android-37.x estavel foi encontrado."
            grep -i 'platforms;android-37' "$PACKAGE_LIST" || true
            exit 1
          fi

          BUILD_TOOLS_PACKAGE="$(awk -F'|' '
            {
              package=$1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", package)
              if (package ~ /^build-tools;[0-9]+\.[0-9]+\.[0-9]+$/) print package
            }
          ' "$PACKAGE_LIST" | sort -V | tail -n 1)"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "::error::Nenhum pacote Build Tools estavel foi encontrado."
            grep -i 'build-tools;' "$PACKAGE_LIST" || true
            exit 1
          fi

          NDK_PACKAGE="ndk;29.0.14206865"
          if ! grep -Fq "$NDK_PACKAGE" "$PACKAGE_LIST"; then
            echo "::error::NDK exigido nao encontrado: $NDK_PACKAGE"
            grep -i 'ndk;29' "$PACKAGE_LIST" || true
            exit 1
          fi

          echo "Plataforma: $PLATFORM_PACKAGE"
          echo "Build Tools: $BUILD_TOOLS_PACKAGE"
          echo "NDK: $NDK_PACKAGE"

          sdkmanager --channel=3 \
            "$PLATFORM_PACKAGE" \
            "$BUILD_TOOLS_PACKAGE" \
            "$NDK_PACKAGE"

          PLATFORM_DIR="${PLATFORM_PACKAGE#platforms;}"
          BUILD_TOOLS_DIR="${BUILD_TOOLS_PACKAGE#build-tools;}"

          test -f "$SDK_ROOT/platforms/$PLATFORM_DIR/android.jar"
          test -d "$SDK_ROOT/build-tools/$BUILD_TOOLS_DIR"
          test -f "$SDK_ROOT/ndk/29.0.14206865/source.properties"

          echo "Instalacao Android conferida com sucesso."

      - name: Conferir JAR ajustado e copia original preservada
        shell: bash
        run: |
          set -euo pipefail

          JAR="$PROJECT_DIR/app/src/main/assets/games/meteor_cafe.jar"
          ORIGINAL_JAR="$GITHUB_WORKSPACE/work/METEOR_CAFE_APK_DEDICADO/original/meteor_cafe_original.jar"

          test -f "$JAR"
          echo "99d91a52fc3b4fc0340b6761639aacd98de6b3c5e5bfdce0dab991047c00910a  $JAR" | sha256sum --check

          test -f "$ORIGINAL_JAR"
          echo "a621bf0e11046aabb4ddcaa9c0c3d3a3aefa9340a415c2ce690ef977a394f8c6  $ORIGINAL_JAR" | sha256sum --check

          echo "JAR ajustado e copia original verificados."

      - name: Restaurar biblioteca de audio MIDI
        shell: bash
        run: |
          set -euo pipefail
          SUBMODULE="$PROJECT_DIR/app/src/main/cpp/mmapi_tsf/TinySoundFont"
          rm -rf "$SUBMODULE"
          mkdir -p "$(dirname "$SUBMODULE")"
          git clone --depth 1 https://github.com/schellingb/TinySoundFont.git "$SUBMODULE"
          test -f "$SUBMODULE/tsf.h"
          echo "Biblioteca TinySoundFont restaurada."

      - name: Conferir versoes do Gradle e Java
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          java -version
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compilar variante Meteor Debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleMeteorDebug

      - name: Conferir APK gerado
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/meteor/debug"
          test -d "$APK_DIR"
          APK_FILE="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::A compilacao terminou sem produzir APK na pasta esperada."
            find "$PROJECT_DIR/app/build/outputs/apk" -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "APK produzido: $APK_FILE"
          sha256sum "$APK_FILE"
          ls -lh "$APK_FILE"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v6
        with:
          name: Meteor-Cafe-APK-V9-debug
          path: work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader/app/build/outputs/apk/meteor/debug/*.apk
          if-no-files-found: error
          retention-days: 7
