name: Compilar Meteor Cafe — V8

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir APK Meteor Cafe
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7.0.1

      - name: Extrair projeto dedicado
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/METEOR_CAFE_APK_DEDICADO_FONTE_GALAXY_A05_V8_UPLOAD.zip"
          test -f "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/work"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/work"

          PROJECT_DIR="$GITHUB_WORKSPACE/work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader"

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto extraido e conferido: $PROJECT_DIR"

      - name: Preparar Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          # O cache do Gradle fica desativado: o projeto vem dentro do ZIP.
          # Assim evitamos procurar arquivos Gradle antes de extraí-lo.

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Encontrar e instalar Android API 37, Build Tools e NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT nao foi definido."
            exit 1
          fi

          PACKAGE_LIST="$RUNNER_TEMP/android-sdk-packages.txt"

          echo "Consultando os pacotes do SDK, incluindo o canal preview..."
          sdkmanager --list --channel=3 > "$PACKAGE_LIST"

          PLATFORM_PACKAGE="$(
            awk -F'|' '
              {
                package=$1
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", package)
                if (package ~ /^platforms;android-37\.[0-9]+$/) print package
              }
            ' "$PACKAGE_LIST" | sort -V | tail -n 1
          )"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "::error::Nenhum pacote platforms;android-37.x estavel foi encontrado."
            grep -i 'platforms;android-37' "$PACKAGE_LIST" || true
            exit 1
          fi

          BUILD_TOOLS_PACKAGE="$(
            awk -F'|' '
              {
                package=$1
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", package)
                if (package ~ /^build-tools;[0-9]+\.[0-9]+\.[0-9]+$/) print package
              }
            ' "$PACKAGE_LIST" | sort -V | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "::error::Nenhum pacote Build Tools estavel foi encontrado."
            grep -i 'build-tools;' "$PACKAGE_LIST" || true
            exit 1
          fi

          NDK_PACKAGE="ndk;29.0.14206865"
          if ! grep -Fq "$NDK_PACKAGE" "$PACKAGE_LIST"; then
            echo "::error::O NDK exigido pelo projeto nao apareceu no catalogo: $NDK_PACKAGE"
            grep -i 'ndk;29' "$PACKAGE_LIST" || true
            exit 1
          fi

          echo "Plataforma selecionada: $PLATFORM_PACKAGE"
          echo "Build Tools selecionadas: $BUILD_TOOLS_PACKAGE"
          echo "NDK selecionado: $NDK_PACKAGE"

          sdkmanager --channel=3 \
            "$PLATFORM_PACKAGE" \
            "$BUILD_TOOLS_PACKAGE" \
            "$NDK_PACKAGE"

          PLATFORM_DIR="${PLATFORM_PACKAGE#platforms;}"
          BUILD_TOOLS_DIR="${BUILD_TOOLS_PACKAGE#build-tools;}"

          test -f "$SDK_ROOT/platforms/$PLATFORM_DIR/android.jar"
          test -d "$SDK_ROOT/build-tools/$BUILD_TOOLS_DIR"
          test -f "$SDK_ROOT/ndk/29.0.14206865/source.properties"

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "PLATFORM_PACKAGE=$PLATFORM_PACKAGE" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_PACKAGE=$BUILD_TOOLS_PACKAGE" >> "$GITHUB_ENV"
          echo "Instalacao Android conferida com sucesso."

      - name: Conferir JAR ajustado e copia original preservada
        shell: bash
        run: |
          set -euo pipefail

          JAR="$PROJECT_DIR/app/src/main/assets/games/meteor_cafe.jar"
          test -f "$JAR"

          echo "99d91a52fc3b4fc0340b6761639aacd98de6b3c5e5bfdce0dab991047c00910a  $JAR" | sha256sum --check
          echo "JAR do aplicativo localizado e verificado."
          ORIGINAL_JAR="$GITHUB_WORKSPACE/work/METEOR_CAFE_APK_DEDICADO/original/meteor_cafe_original.jar"
          test -f "$ORIGINAL_JAR"
          echo "a621bf0e11046aabb4ddcaa9c0c3d3a3aefa9340a415c2ce690ef977a394f8c6  $ORIGINAL_JAR" | sha256sum --check
          echo "Copia original intacta verificada."

      - name: Restaurar biblioteca de audio MIDI
        shell: bash
        run: |
          set -euo pipefail

          SUBMODULE="$PROJECT_DIR/app/src/main/cpp/mmapi_tsf/TinySoundFont"
          rm -rf "$SUBMODULE"
          mkdir -p "$(dirname "$SUBMODULE")"

          git clone --depth 1 https://github.com/schellingb/TinySoundFont.git "$SUBMODULE"
          test -f "$SUBMODULE/tsf.h"

          echo "Biblioteca TinySoundFont restaurada."

      - name: Conferir versoes do Gradle e Java
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          java -version
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compilar variante Meteor Debug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleMeteorDebug

      - name: Conferir APK gerado
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/meteor/debug"
          test -d "$APK_DIR"

          APK_FILE="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::A compilacao terminou sem produzir um APK na pasta esperada."
            find "$PROJECT_DIR/app/build/outputs/apk" -type f -maxdepth 5 -print || true
            exit 1
          fi

          echo "APK produzido: $APK_FILE"
          sha256sum "$APK_FILE"
          ls -lh "$APK_FILE"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v6
        with:
          name: Meteor-Cafe-APK-V8-debug
          path: work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader/app/build/outputs/apk/meteor/debug/*.apk
          if-no-files-found: error
          retention-days: 7
