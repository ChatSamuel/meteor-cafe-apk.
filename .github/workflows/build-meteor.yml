name: Compilar Meteor Cafe

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças e instalar ferramentas
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          unzip -q METEOR_CAFE_APK_DEDICADO_FONTE.zip -d work
          mkdir -p work/METEOR_CAFE_APK_DEDICADO/vendor
          mv work/J2ME-Loader work/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader 2>/dev/null || true

      - name: Recuperar biblioteca de áudio
        run: |
          PROJECT_DIR="$(find work -type d -name J2ME-Loader | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "J2ME-Loader não encontrado."
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/app/src/main/cpp/mmapi_tsf/TinySoundFont"
          git clone --depth 1 https://github.com/schellingb/TinySoundFont.git "$PROJECT_DIR/app/src/main/cpp/mmapi_tsf/TinySoundFont"

      - name: Compilar Meteor Café
        run: |
          PROJECT_DIR="$(find work -type d -name J2ME-Loader | head -n 1)"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assemblemeteorDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meteor-Cafe-APK
          path: work/**/J2ME-Loader/app/build/outputs/apk/
          if-no-files-found: error
          retention-days: 7
