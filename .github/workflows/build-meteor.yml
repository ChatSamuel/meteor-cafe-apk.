name: Compilar METEOR CAFE 1.1.0

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/METEOR_CAFE_APK_DEDICADO/**'
      - '.github/workflows/build-meteor.yml'

permissions:
  contents: read

jobs:
  build:
    name: Construir METEOR CAFE 1.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7.0.1

      - name: Definir caminho do projeto e conferir arquivos
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/android/METEOR_CAFE_APK_DEDICADO/vendor/J2ME-Loader"
          ORIGINAL_JAR="$GITHUB_WORKSPACE/android/METEOR_CAFE_APK_DEDICADO/original/meteor_cafe_original.jar"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/games/meteor_cafe.jar"
          test -f "$ORIGINAL_JAR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ORIGINAL_JAR=$ORIGINAL_JAR" >> "$GITHUB_ENV"

      - name: Preparar Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Encontrar e instalar Android API 37, Build Tools e NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          PACKAGE_LIST="$RUNNER_TEMP/android-sdk-packages.txt"
          sdkmanager --list --channel=3 > "$PACKAGE_LIST"

          PLATFORM_PACKAGE="$(awk -F'|' '{p=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", p); if (p ~ /^platforms;android-37\.[0-9]+$/) print p}' "$PACKAGE_LIST" | sort -V | tail -n 1)"
          BUILD_TOOLS_PACKAGE="$(awk -F'|' '{p=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", p); if (p ~ /^build-tools;[0-9]+\.[0-9]+\.[0-9]+$/) print p}' "$PACKAGE_LIST" | sort -V | tail -n 1)"
          NDK_PACKAGE='ndk;29.0.14206865'

          if [ -z "$PLATFORM_PACKAGE" ] || [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "::error::Não foi possível localizar Android API 37.x e Build Tools."
            grep -E 'platforms;android-37|build-tools;' "$PACKAGE_LIST" || true
            exit 1
          fi
          grep -Fq "$NDK_PACKAGE" "$PACKAGE_LIST"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE" "$NDK_PACKAGE"

          PLATFORM_DIR="${PLATFORM_PACKAGE#platforms;}"
          BUILD_TOOLS_DIR="${BUILD_TOOLS_PACKAGE#build-tools;}"
          test -f "$SDK_ROOT/platforms/$PLATFORM_DIR/android.jar"
          test -d "$SDK_ROOT/build-tools/$BUILD_TOOLS_DIR"
          test -f "$SDK_ROOT/ndk/29.0.14206865/source.properties"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_DIR=$SDK_ROOT/build-tools/$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

      - name: Conferir JAR da versão 1.1.0 e original
        shell: bash
        run: |
          set -euo pipefail
          JAR="$PROJECT_DIR/app/src/main/assets/games/meteor_cafe.jar"
          echo "81b4bc734c18406bcfe250846157dd0b84ab6cb29712f76c1a636a850fce1d3a  $JAR" | sha256sum --check
          echo "a621bf0e11046aabb4ddcaa9c0c3d3a3aefa9340a415c2ce690ef977a394f8c6  $ORIGINAL_JAR" | sha256sum --check

      - name: Restaurar TinySoundFont (áudio MIDI)
        shell: bash
        run: |
          set -euo pipefail
          SUBMODULE="$PROJECT_DIR/app/src/main/cpp/mmapi_tsf/TinySoundFont"
          rm -rf "$SUBMODULE"
          mkdir -p "$(dirname "$SUBMODULE")"
          git clone --depth 1 https://github.com/schellingb/TinySoundFont.git "$SUBMODULE"
          test -f "$SUBMODULE/tsf.h"
          test -f "$SUBMODULE/LICENSE"

      - name: Conferir Gradle e Java
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          java -version
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compilar variante Meteor 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleMeteorDebug

      - name: Conferir e renomear APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/meteor/debug"
          test -d "$APK_DIR"
          APK_FILE="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "::error::O APK não foi encontrado na pasta esperada."
            find "$PROJECT_DIR/app/build/outputs/apk" -type f -print || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/dist/METEOR_CAFE_1.1.0.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/METEOR_CAFE_1.1.0.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/METEOR_CAFE_1.1.0.apk"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v6
        with:
          name: METEOR-CAFE-1.1.0-ANDROID
          path: dist/METEOR_CAFE_1.1.0.apk
          if-no-files-found: error
          retention-days: 14
